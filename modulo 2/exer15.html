<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modelos de caixas</title>
</head>
<style>
    h1{
        background-color: lightgray;
        font-family: Arial, Helvetica, sans-serif;
        height: 300px;
        width: 300px;
        border-width: 10px;
        border-style: solid;
        border-color: darkgrey;

        padding-top: 5px;
        padding-bottom: 5px;
        padding-left: 5px;
        padding-right: 5px;


    }
    p{
        font-family: Arial, Helvetica, sans-serif;
    }
    a{
        border-width: 3px;
        border-style: solid;
        border-color: rgb(79, 79, 194);
        color: rgb(43, 76, 226);
        padding-left: 2px;
        padding-right: 2px;
    }

</style>
<body>
    <h1>Exemplo de box-level</h1>
    <p>Parágrafos também são exemplos de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a>. Vamos ver como tudo isso funciona!</p>
</body>
</html>
