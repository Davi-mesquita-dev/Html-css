<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>background-position-div</title>
</head>
<style>
    body{
        background-image: url(imagens-modulo3/wallpaper001.jpg);
    }

    div.q{
        height: 200px;
        border: 2px solid black;
        border-radius: 10px;
        margin-top: 5px;
    }
    div#q1{
        background-image: url(imagens-modulo3/wallpaper002.jpg);
        background-position: left top;
    }
    div#q2{
        background-image: url(imagens-modulo3/wallpaper002.jpg);
        background-position: center center;
    }
    div#q3{
        background-image: url(imagens-modulo3/wallpaper002.jpg);
        background-position: right bottom;
    }



</style>
<body>
    <div class="q" id="q1">
    </div>
    <div class="q" id="q2">
    </div>
    <div class="q" id="q3">
    </div>
</body>
</html>
