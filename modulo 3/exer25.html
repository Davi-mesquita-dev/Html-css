<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table{
        border-collapse: collapse;
    }
    td{
        border: 1px solid black;
    }

    td,th{
        width: 200px;
        height: 30px;
        padding: 10px;
    }

    .cen{
        text-align: center;
    }
</style>
<body>
    <h1>Mescla de células</h1>
    <table>
        <tr>
            <td>
                A
            </td>
            <td colspan="2" class="cen">
                B
            </td>
        </tr>
        <tr>
            <td colspan="2">
                D
            </td>
            
            <td>
                F   
            </td>
        </tr>
        <tr>
            <td colspan="3" class="cen">
                H
            </td>
        </tr>
    </table>
</body>
</html>
