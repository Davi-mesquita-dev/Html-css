<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
     table{
        border-collapse: collapse;
        font-family: Arial, Helvetica, sans-serif;
    }

    td, th, tr{
        border: solid 1px black;
    }
    
    tr, td, th{
        width: 300px;
        height: 30px;
        padding: 10px;
    }

    col.cverde{
        background-color: green;
    }
    
    col.cvermelho{
        background-color: red;
    }
</style>
<body>
    <table>
        <colgroup>
            <col class="cverde">
            <col class="cbranco">
            <col class="cvermelho">
        </colgroup>
        <tr>
            <th scope="col"></th>
            <th scope="col"></th>
            <th scope="col"></th>
        </tr>
        <tr>
            <th scope="col"></th>
            <th scope="col"></th>
            <th scope="col"></th>
        </tr>
        <tr>
             <th scope="col"></th>
            <th scope="col"></th>
             <th scope="col"></th>
        </tr>
        <tr>
            <th scope="col"></th>
            <th scope="col"></th>
            <th scope="col"></th>
        </tr>
    </table>
</body>
</html>
