<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    table{
        border-collapse: collapse;
        font-family: Arial, Helvetica, sans-serif;
    }

    td, th, tr{
        border: solid 1px black;
    }
    
    tr, td, th{
        width: 300px;
        height: 30px;
        padding: 10px;
    }
</style>
<body>
    <table>
        <caption>Filmes Favoritos</caption>
        <thead>
            <tr>
                <th>Grupo</th>
                <th>Nomes</th>
                <th colspan="2" scope="rowgroup">Filmes</th>
            </tr>
        </thead>
        <tr>
            <th rowspan="2" scope="rowgroup">Mulheres</th>
            <td>Rafaella</td>
            <td>La La Land</td>
            <td>Akira</td>
        </tr>
        <tr>
            <td>Júlia</td>
            <td>Café Lumière</td>
            <td>Pânico V</td>
        </tr>
        <tr>
            <th rowspan="2" scope="rowgroup">Homens</th>
            <td>Davi</td>
            <td>Bastardos Inglórios</td>
            <td>Whiplash</td>
        </tr>
        <tr>
            <td>Michel</td>
            <td>Waves</td>
            <td>She</td>
        </tr>
    </table>
</body>
</html>
