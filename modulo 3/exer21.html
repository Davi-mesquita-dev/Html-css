<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alinhamento Vertical</title>
</head>
<style>
    .container{
        background-image: url(imagens-modulo3/target001.png);
        background-size: 100% 100%;
        height: 96vh;

        position: relative;
        padding: 10px;
        background-color: blueviolet;
    }
    .conteudo{
        background-image: url(imagens-modulo3/target001.png);
        background-size: 100% 100%;
        position: absolute;
        width: 400px;
        height: 200px;
        background-color: rgb(196, 33, 33);

        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
    }
</style>
<body>
    <section class="container">
        <article class="conteudo"> 

        </article>
    </section>
</body>
</html>
