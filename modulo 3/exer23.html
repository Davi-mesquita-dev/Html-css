<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Grande</title>
</head>
<Style>
    body{
        font-family: Arial, Helvetica, sans-serif;
    }

    table{
        border-collapse: collapse;
    }

    th, td{
        border: 1px solid black;
        width: 200px;
        height: 30px;
        padding: 10px;
    }

    caption{
        background-color: gray;
    }

    .cabeca{
        background-color: lightgray;
    }

    .foot{
        background-color: lightgray;
    }

    .num{
        text-align: right;
    }
</Style>
<body>
    <h1>Tabela Grande</h1>
    <table>
        <caption>População das Unidades Federativas</caption>
        <thead class="cabeca">
            <tr>
                <th scope="col">Unidade Federativa</th>
                <th scope="col">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td class="num">46 081 801</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 393 441</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td class="num">17 223 547</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td class="num">14 870 907</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td class="num">11 890 517</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td class="num">11 233 263</td>
            </tr>
        </tbody>
        <tfoot class="foot">
            <tr>
                <th scope="row">Total</th>
                <th class="num">122.693.576</th>
            </tr>
        </tfoot>
    </table>
</body>
</html>
